server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Moderator app - всё что начинается с /moderator
    # Приложение настроено на базовый путь /moderator для роутинга,
    # но внутри контейнера файлы лежат по корневому пути, поэтому убираем префикс
    location /moderator/ {
        limit_req zone=general_limit burst=20 nodelay;
        
        # Убираем префикс /moderator/ перед проксированием
        # /moderator/assets/... -> /assets/...
        # /moderator/ -> /
        rewrite ^/moderator/(.*)$ /$1 break;
        
        proxy_pass http://moderator_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_cache_bypass $http_upgrade;
        
        proxy_redirect off;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Редирект /moderator на /moderator/
    location = /moderator {
        return 301 /moderator/;
    }

    # API endpoints - Backend (NestJS)
    # Backend имеет глобальный префикс 'api', поэтому передаем путь как есть
    location /api {
        limit_req zone=api_limit burst=5 nodelay;
        
        # Передаем путь без изменений, так как backend ожидает /api/v1/...
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Default location - Frontend app (главное приложение)
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

