# Upstream серверы для балансировки нагрузки
# Настройте под ваши приложения

upstream backend {
    # Пример: один сервер
    server backend:8080;
    
    # Пример: несколько серверов с балансировкой
    # server backend1:8080 weight=3;
    # server backend2:8080 weight=2;
    # server backend3:8080 backup;
    
    # keepalive connections
    keepalive 32;
}

upstream api_backend {
    server api:3000;
    keepalive 32;
}

