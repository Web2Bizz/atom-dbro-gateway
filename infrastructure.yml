services:
  gateway:
    build:
      context: ./services/gateway
    container_name: atom-release-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/gateway/nginx/logs:/var/log/nginx
    networks:
      - gateway-network
      - frontend-network
      - internal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    dns:
      - 8.8.8.8
      - 8.8.4.4

  postgres:
    image: postgres:17-alpine
    container_name: atom-release-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atom_dbro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432" # local DB access for admins
    volumes:
      - atom-back_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal-network:
        aliases:
          - postgres
    restart: unless-stopped

  emailer:
    image: emailer:latest
    container_name: atom-release-emailer
    ports:
      - "9500"
    env_file:
      - ./services/emailer/.env
    networks:
      internal-network:
        aliases:
          - emailer
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4

  redis:
    image: redis:7-alpine
    container_name: atom-release-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atom-redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal-network:
        aliases:
          - redis
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: atom-release-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - atom-rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal-network:
        aliases:
          - rabbitmq
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: atom-release-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - atom-prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: atom-release-grafana
    ports:
      - "3000:3000"
    volumes:
      - atom-grafana_data:/var/lib/grafana
    networks:
      - internal-network
    restart: unless-stopped

volumes:
  atom-back_postgres_data:
    external: true
  atom-redis_data:
    driver: local
  atom-rabbitmq_data:
    driver: local
  atom-prometheus_data:
    driver: local
  atom-grafana_data:
    driver: local

networks:
  internal-network:
    name: atom_internal_network
    driver: bridge
  frontend-network:
    name: atom_frontend_network
    driver: bridge
  gateway-network:
    name: atom_gateway_network
    driver: bridge
