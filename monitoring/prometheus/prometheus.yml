global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'atom-backend'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['backend-app:3000']
  - job_name: 'atom-admin-backend'
    metrics_path: /admin/api/v1/metrics
    static_configs:
      - targets: ['backend-admin-app:3000']


