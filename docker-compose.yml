services:
  # Gateway service - единая точка входа
  gateway:
    build:
      context: ./services/gateway
    container_name: atom-release-gateway
    ports:
      - "3000:80"
    volumes:
      - ./services/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/gateway/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/gateway/nginx/logs:/var/log/nginx
    networks:
      - gateway-network
      - atom-external-network
      - frontend-network
      - moderator-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - backend-app
      - frontend-app
      - moderator-app

  # Backend services (из services/atom-dbro-backend)
  postgres:
    image: postgres:17-alpine
    container_name: atom-release-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atom_dbro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atom-back_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atom-internal-network
    restart: unless-stopped

  backend-app:
    build:
      context: ./services/atom-dbro-backend
    container_name: atom-release-backend-app
    # Порт не пробрасывается наружу, доступен только через gateway
    expose:
      - "3000"
    env_file:
      - ./services/atom-dbro-backend/.env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-atom_dbro}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/atom-dbro-backend/src:/app/src
      - ./services/atom-dbro-backend/package.json:/app/package.json
      - ./services/atom-dbro-backend/drizzle:/app/drizzle
    networks:
      - atom-external-network
      - atom-internal-network
    restart: unless-stopped

  # Frontend app (из services/atom-dbro-frontend)
  frontend-app:
    build:
      context: ./services/atom-dbro-frontend
    container_name: atom-release-frontend-app
    # Порт не пробрасывается наружу, доступен только через gateway
    expose:
      - "80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network

  # Moderator app frontend (из services/atom-dbro-moderator-app)
  moderator-app:
    build:
      context: ./services/atom-dbro-moderator-app
    container_name: atom-release-moderator-app
    # Порт не пробрасывается наружу, доступен только через gateway
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - moderator-network

volumes:
  atom-back_postgres_data:
    external: true

networks:
  gateway-network:
    driver: bridge
  atom-external-network:
    driver: bridge
  atom-internal-network:
    driver: bridge
  frontend-network:
    driver: bridge
  moderator-network:
    driver: bridge

