services:
  backend-admin-app:
    image: backend-admin-app:latest
    container_name: atom-release-admin-backend-app
    expose:
      - "3000"
    env_file:
      - ./services/atom-dbro-backend-admin/.env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-atom_dbro}
    networks:
      internal-network:
        aliases:
          - backend-admin-app
    restart: unless-stopped

  backend-app:
    image: backend-app:latest
    container_name: atom-release-backend-app
    expose:
      - "3000"
    env_file:
      - ./services/atom-dbro-backend/.env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-atom_dbro}
    networks:
      internal-network:
        aliases:
          - backend-app
    restart: unless-stopped

  hakaton-app:
    image: atom-front-app:latest
    container_name: atom-release-hakaton-app
    expose:
      - "80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      frontend-network:
        aliases:
          - hakaton-app

  frontend-admin-app:
    image: frontend-admin-app:latest
    container_name: atom-release-admin-frontend-app
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      frontend-network:
        aliases:
          - frontend-admin-app

  chatty-app:
    image: chatty-app:latest
    container_name: atom-release-chatty-app
    expose:
      - "3000"
    restart: unless-stopped

networks:
  internal-network:
    external: true
    name: atom_internal_network
  frontend-network:
    external: true
    name: atom_frontend_network
  gateway-network:
    external: true
    name: atom_gateway_network
